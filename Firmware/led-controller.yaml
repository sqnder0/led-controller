# ESPHome config for the smart ledbox (ESP32-C3 SuperMini)
# Pin map matches the KiCad schematic:
#   GPIO0/1/3  -> gate resistors -> AO3400A low-side MOSFETs (R, G, B)
#   GPIO4/5    -> I2C (BH1750)
#   GPIO6/7    -> UART (LD2410C)
#   GPIO10     -> VS1838B / TSOP38238 IR receiver output
# Copy secrets.example.yaml to secrets.yaml and fill in your own values.

esphome:
  name: smart-ledbox
  friendly_name: Smart ledbox

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Smart-ledbox Fallback"
    password: !secret ap_password

captive_portal:

# LED strip: three N-channel MOSFETs switch each colour to ground.
# Gate high = channel on, so the PWM outputs are not inverted.
output:
  - platform: ledc
    pin: GPIO0
    id: out_red
    frequency: 1000Hz
  - platform: ledc
    pin: GPIO1
    id: out_green
    frequency: 1000Hz
  - platform: ledc
    pin: GPIO3
    id: out_blue
    frequency: 1000Hz

light:
  - platform: rgb
    name: "LED strip"
    id: led_strip
    red: out_red
    green: out_green
    blue: out_blue
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 300ms

# BH1750 light sensor
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

sensor:
  - platform: bh1750
    name: "Ambient light"
    id: ambient_light
    address: 0x23
    update_interval: 10s

# LD2410C presence radar
uart:
  id: ld_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: presence_sensor
    has_moving_target:
      name: "Moving target"
    has_still_target:
      name: "Still target"

# IR receiver, so the original remote keeps working.
# The receiver output idles high, hence inverted.
remote_receiver:
  pin:
    number: GPIO10
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%

# Presence-based automation example: turn the strip on in the dark when
# someone is there, off when the room is empty for a while.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: presence_sensor
              - lambda: 'return id(ambient_light).state < 15;'
              - light.is_off: led_strip
          then:
            - light.turn_on:
                id: led_strip
                brightness: 40%
